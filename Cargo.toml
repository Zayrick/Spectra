[package]
name = "spectra"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hidapi = { version = "2.6.6", default-features = false }
iced = { version = "0.14.0", features = ["advanced", "canvas", "svg", "tokio"] }
mdns-sd = { version = "0.21.0", default-features = false }
mlua = { version = "0.12.0", features = ["lua55", "vendored", "send"] }
skia-safe = { version = "0.99.0", features = ["binary-cache"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38.0"
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native-basic-udev"] }
skia-safe = { version = "0.99.0", features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSNotification", "NSOperation", "NSObject", "NSString", "block2"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice", "MTLCommandQueue"] }
skia-safe = { version = "0.99.0", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["windows-native"] }
skia-safe = { version = "0.99.0", features = ["d3d"] }
windows = { version = "0.62.0", features = ["Win32", "Win32_Foundation", "Win32_Graphics", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
